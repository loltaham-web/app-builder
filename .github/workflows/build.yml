name: Build APK

on:
  push:
    paths:
      - 'www/**'
      - 'app.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App to APK
        run: |
          echo "Building APK for your web app..."
          mkdir -p build/output
          echo "Dummy APK content" > build/output/app-release.apk

      - name: Create Release & Upload APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.run_number }}
          files: build/output/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
